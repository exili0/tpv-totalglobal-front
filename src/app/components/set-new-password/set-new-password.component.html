<div class="set-new-password-container">
    <div class="set-new-password-data">
        <img src="assets/SoloLogoVerde.png" alt="Logo TPV" class="logo" />
        <div class="title-page">
            <h2>Actualizar contraseña</h2>
        </div>
        
        <div class="set-new-password-form">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input 
                    type="text" 
                    id="username" 
                    [(ngModel)]="username"
                    disabled
                    class="username-display">
            </div>

            <div class="form-group">
                <label for="newPassword">Nueva contraseña</label>
                <div class="password-input-group">
                    <input 
                        [type]="showNewPassword ? 'text' : 'password'"
                        id="newPassword" 
                        placeholder="Ingresa tu nueva contraseña"
                        [(ngModel)]="newPassword"
                        [disabled]="isLoading">
                    <button
                        type="button"
                        class="toggle-password-btn"
                        (click)="toggleShowNewPassword()"
                        [disabled]="isLoading"
                        tabindex="-1"
                        aria-label="Mostrar/ocultar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" [style.fill]="showNewPassword ? 'var(--primary-color)' : 'var(--secondary-color)'">
                            <path d="M0 0h24v24H0z" fill="none"/>
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <div class="password-input-group">
                    <input 
                        [type]="showConfirmPassword ? 'text' : 'password'" 
                        id="confirmPassword" 
                        placeholder="Confirma tu nueva contraseña"
                        [(ngModel)]="confirmPassword"
                        [disabled]="isLoading">
                    <button
                        type="button"
                        class="toggle-password-btn"
                        (click)="toggleShowConfirmPassword()"
                        [disabled]="isLoading"
                        tabindex="-1"
                        aria-label="Mostrar/ocultar confirmación de contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" [style.fill]="showConfirmPassword ? 'var(--primary-color)' : 'var(--secondary-color)'">
                            <path d="M0 0h24v24H0z" fill="none"/>
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <div class="set-new-password-actions">
                <button type="button" class="back-btn" (click)="goToLogin()">Volver</button>
                <button type="submit" class="submit-btn" (click)="setNewPassword()" [disabled]="isLoading">
                    {{ isLoading ? 'Actualizando...' : 'Actualizar contraseña' }}
                </button>
            </div>
            
        </div>
    </div>
</div>
