<div class="restore-password-container">
    <div class="restore-password-data">
        <img src="assets/SoloLogoVerde-compact.png" alt="Logo TPV" class="logo" />
        
        <div class="title-page">
            <h2>{{ isSetupMode ? 'Configurar preguntas de seguridad' : 'Recuperar contraseña' }}</h2>
            <p *ngIf="isSetupMode" class="subtitle">Establece tus preguntas de seguridad para recuperar tu contraseña en el futuro</p>
        </div>

        <div class="restore-password-form">
            <div class="form-group" *ngIf="!isSetupMode">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" placeholder="Introduzca el nombre de usuario" [(ngModel)]="username" [disabled]="isLoading">
            </div>
            
            <div class="form-group" *ngIf="isSetupMode">
                <label for="username">Usuario</label>
                <input type="text" id="username" [(ngModel)]="username" disabled>
            </div>

            <div class="form-group">
                <label>Preguntas de seguridad</label>
                <div class="security-questions">
                    <div class="question">
                        <label for="motherName">¿Nombre de tu madre?</label>
                        <input type="text" id="motherName" placeholder="Responde la pregunta" [(ngModel)]="firstAnswer" [disabled]="isLoading">
                    </div>
                    <div class="question">
                        <label for="grandMotherName">¿Nombre de tu abuela?</label>
                        <input type="text" id="grandMotherName" placeholder="Responde la pregunta" [(ngModel)]="secondAnswer" [disabled]="isLoading">
                    </div>
                </div>
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <div class="restore-password-actions">
                <button type="button" class="back-btn" (click)="goToLogin()" *ngIf="!isSetupMode">
                    Volver
                </button>
                <button type="submit" class="submit-btn" (click)="restorePassword()" [disabled]="isLoading">
                    {{ isLoading ? (isSetupMode ? 'Guardando...' : 'Verificando...') : (isSetupMode ? 'Guardar y finalizar' : 'Enviar') }}
                </button>
            </div>
        </div>
    </div>
</div>
