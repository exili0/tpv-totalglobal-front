<div class="product-grid-container">
  <div *ngIf="isLoading" class="loading">
    <p>Cargando productos...</p>
  </div>

  <div *ngIf="error" class="error">
    <p>{{error}}</p>
  </div>

  <div *ngIf="!isLoading && products.length === 0" class="no-products">
    <p>No hay productos en esta categoría</p>
  </div>

  <div *ngIf="!isLoading && products.length > 0" class="grid">
    <div *ngFor="let product of products" class="product-card" (click)="addToCart(product)">
      <div class="product-image">
        <img *ngIf="product.imageUrl" [src]="product.imageUrl" [alt]="product.name">
        <div *ngIf="!product.imageUrl" class="no-image" aria-label="Imagen no disponible">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="m840-234-80-80v-446H314l-80-80h526q33 0 56.5 23.5T840-760v526ZM792-56l-64-64H200q-33 0-56.5-23.5T120-200v-528l-64-64 56-56 736 736-56 56ZM240-280l120-160 90 120 33-44-283-283v447h447l-80-80H240Zm297-257ZM424-424Z"/></svg>
        </div>
      </div>

      <div class="product-info">
        <h3>{{product.name}}</h3>
        <div class="product-meta" *ngIf="isExpanded(product.id)">
          <p class="description">{{product.description}}</p>
          <p class="price">{{product.price | currency:'EUR':'symbol':'1.2-2':'es-ES'}}</p>
        </div>
        <small *ngIf="product.stock" class="stock">Stock: {{product.stock}}</small>
      </div>

      <button
        type="button"
        class="btn-toggle-details"
        (click)="toggleDetails(product.id, $event)"
        [attr.aria-label]="isExpanded(product.id) ? 'Ocultar detalles' : 'Ver detalles'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M440-280h80v-240h-80v240Zm68.5-331.5Q520-623 520-640t-11.5-28.5Q497-680 480-680t-28.5 11.5Q440-657 440-640t11.5 28.5Q463-600 480-600t28.5-11.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
      </button>
    </div>
  </div>
</div>
