<div class="login-container">
    <div class="login-data">
        <img class="login-logo" src="assets/LOGO_final.png" alt="Logo TPV" />
        
        <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div class="form-group">
                <input 
                    type="text" 
                    id="username" 
                    formControlName="username"
                    placeholder="Ingresa tu usuario" 
                    required>
            </div>

            <div class="form-group">
                <div class="password-input-group">
                    <input 
                        [type]="showPassword ? 'text' : 'password'" 
                        id="password" 
                        formControlName="password"
                        placeholder="Ingresa tu contraseña" 
                        required>
                    
                    <button
                        type="button"
                        class="toggle-password-btn"
                        (click)="toggleShowPassword()"
                        [disabled]="isLoading"
                        tabindex="-1"
                        aria-label="Mostrar/ocultar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" [style.fill]="showPassword ? 'var(--primary-color)' : 'var(--secondary-color)'">
                            <path d="M0 0h24v24H0z" fill="none"/>
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button class="restore-password-button" type="button" (click)="goToRestorePassword()">
                <p class="login-help">He olvidado la contraseña...</p>
            </button>
            
            <button class="submit-btn" type="submit" [disabled]="isLoading">
                {{ isLoading ? 'Cargando...' : 'Acceder' }}
            </button>
        </form>
    </div>
</div>
