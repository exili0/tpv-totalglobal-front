<div class="accessibility-page">
  <app-navbar [isMenuOpen]="false" [transparentBackdrop]="false"></app-navbar>
  <!--------------------------------------------->
  <main class="accessibility-container">
    <section class="settings-card">
      <h1>Accesibilidad Visual</h1>
      <p>Selecciona el perfil visual más adecuado según el tipo de daltonismo y contraste necesario.</p>

      <div class="theme-options">
        <button
          *ngFor="let option of themeOptions"
          type="button"
          class="theme-option"
          [class.theme-option--active]="isThemeSelected(option.value)"
          (click)="setTheme(option.value)">
          <span class="theme-title">{{ option.title }}</span>
          <span class="theme-description">{{ option.description }}</span>
        </button>
      </div>

      <div class="filter-preview" aria-hidden="true">
        <p class="filter-preview__title">Vista previa del filtro</p>
        <div class="filter-preview__balls">
          <span class="preview-ball preview-ball--red"></span>
          <span class="preview-ball preview-ball--green"></span>
          <span class="preview-ball preview-ball--yellow"></span>
          <span class="preview-ball preview-ball--blue"></span>
        </div>
      </div>
    </section>
  </main>
</div>
